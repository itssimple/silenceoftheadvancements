modLoader="javafml"
loaderVersion="${forge_loader_version_range}"
license="${license}"
issueTrackerURL="https://github.com/itssimple/.mod-issue-tracker/issues?q=state%3Aopen%20label%3A%22mod%3A%20Silence%20of%20the%20Advancements%22"
logoFile= "icon.png"

[[mods]]
modId="${mod_id}"
version="${version}"
displayName="${mod_name}"
displayURL=""
authors="$mod_author"
description='''${description}'''

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="SERVER"

[[mixins]]
    config="${mod_id}.mixins.json"